<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFood</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="container">
    <header class="header">
        <div class="header__container">
            <a href="/" class="header__logo">
                <h2 ><span>EFood</span></h2>
            </a>
             <div class="burger-menu">
                <nav class="header__nav">
                    <ul class="nav__list">
                        <li class="nav__item"><a href="/" class="nav__link active">Home</a></li>
                        <li class="nav__item"><a href="#service" class="nav__link">Service</a></li>
                        <li class="nav__item"><a href="#cities" class="nav__link">Top cities</a></li>
                        <li class="nav__item"><a href="#contact" class="nav__link">Contract</a></li>
                    </ul>
                </nav>    
                <div class="header__actions">
                    <button class="action__search">
                        <img src="images/little_search.png" alt="Search icon">
                    </button>
                    
                    <button class="action__cart">
                        <img src="images/cart.png" alt="Cart icon">
                        <span class="cart__badge">4</span>
                    </button>
                   
                    
                </div>
             </div>   
             <div class="menu_right">
                <button class="header__right-button">
                    <span class="signup_span">Sign Up</span>
                </button>
                <button class="mobile-menu-btn">
                    <img src="images/burger-menu.svg" alt="Menu">
                </button>  
             </div>
           
        </div>
    </header>
</body>
</html>
